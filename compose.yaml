
services:
  db: 
    image: postgres:17-alpine
    restart: unless-stopped
    expose:
      - "5432"
    ports:
      - "25000:5432"
    environment:
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: Monarca
      POSTGRES_USER: postgres
    container_name: monarca_database
    volumes:
      - ./DB/postgres:/var/lib/postgresql/data
